<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PathMemo Web Viewer</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
            overflow: hidden;
        }
        .container {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        .sidebar {
            width: 360px;
            background: #fff;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header {
            padding: 16px;
            border-bottom: 1px solid #eee;
        }
        .header h1 {
            margin: 0 0 8px 0;
            font-size: 18px;
        }
        .stats {
            display: flex;
            gap: 12px;
            font-size: 13px;
            color: #666;
        }
        .panel {
            padding: 12px 16px;
            border-bottom: 1px solid #eee;
        }
        .panel-title {
            font-size: 13px;
            font-weight: 600;
            color: #666;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .date-inputs {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .date-inputs input {
            flex: 1;
            padding: 6px 8px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 13px;
        }
        .btn {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            background: #2196F3;
            color: white;
            font-size: 13px;
            cursor: pointer;
        }
        .btn:hover { background: #1976D2; }
        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }
        .btn-secondary:hover { background: #d0d0d0; }
        .calendar {
            padding: 12px 16px;
            border-bottom: 1px solid #eee;
            overflow-y: auto;
            max-height: 260px;
        }
        .month {
            margin-bottom: 16px;
        }
        .month-name {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .weekdays, .days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 3px;
        }
        .weekdays div {
            text-align: center;
            font-size: 11px;
            color: #999;
            padding: 4px 0;
        }
        .day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            background: #ebedf0;
            color: #333;
            position: relative;
        }
        .day:hover { outline: 2px solid #2196F3; }
        .day.empty { background: transparent; cursor: default; }
        .day.empty:hover { outline: none; }
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 12px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .legend-color {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        .track-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px;
        }
        .track-item {
            padding: 10px 12px;
            border-radius: 8px;
            background: #f8f9fa;
            margin-bottom: 8px;
            cursor: pointer;
            border-left: 3px solid #2196F3;
        }
        .track-item:hover { background: #e3f2fd; }
        .track-name { font-weight: 600; font-size: 13px; }
        .track-meta { font-size: 12px; color: #666; margin-top: 3px; }
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        #map { flex: 1; background: #f0f0f0; }
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255,255,255,0.95);
            padding: 24px 32px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            text-align: center;
            z-index: 1000;
        }
        .info-popup {
            font-size: 13px;
            line-height: 1.5;
            min-width: 180px;
        }
        .info-popup .time { font-weight: 600; margin-bottom: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <div class="header">
                <h1>PathMemo Web Viewer</h1>
                <div class="stats">
                    <span id="stat-tracks">0 条轨迹</span>
                    <span id="stat-points">0 个点</span>
                </div>
            </div>

            <div class="panel">
                <div class="panel-title">日期范围</div>
                <div class="date-inputs">
                    <input type="date" id="start-date">
                    <span>~</span>
                    <input type="date" id="end-date">
                </div>
                <div style="margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap;">
                    <button class="btn" onclick="applyRange()">查看</button>
                    <button class="btn btn-secondary" onclick="resetRange()">重置</button>
                    <button class="btn btn-secondary" onclick="loadAllPoints()">加载全部</button>
                </div>
            </div>

            <div class="panel">
                <div class="panel-title">时间段图例</div>
                <div class="legend" id="legend"></div>
            </div>

            <div class="calendar" id="calendar"></div>

            <div class="track-list" id="track-list"></div>
        </aside>

        <main class="main">
            <div id="map"></div>
            <div class="loading" id="loading">
                <div>正在加载轨迹数据...</div>
                <div style="font-size: 12px; color: #666; margin-top: 8px;">请确保手机已通过 ADB 连接</div>
            </div>
        </main>
    </div>

    <script>
        // Time buckets matching the mobile app (GCJ-02 coordinates drawn on AMap).
        const TIME_BUCKETS = [
            { start: 0, end: 6, color: '#9C27B0', label: '凌晨 00-06' },
            { start: 6, end: 12, color: '#4CAF50', label: '上午 06-12' },
            { start: 12, end: 18, color: '#FF9800', label: '下午 12-18' },
            { start: 18, end: 24, color: '#F44336', label: '晚上 18-24' }
        ];

        let map = null;
        let markers = [];
        let infoWindow = null;
        let allData = { tracks: [], daily: {}, meta: {} };
        let currentPoints = [];
        let selectedPoint = null;
        let amapKey = '';

        function getBucket(timestamp) {
            const date = new Date(timestamp);
            const hour = date.getHours();
            return TIME_BUCKETS.find(b => hour >= b.start && hour < b.end) || TIME_BUCKETS[TIME_BUCKETS.length - 1];
        }

        function formatDateTime(timestamp) {
            const d = new Date(timestamp);
            const pad = n => n.toString().padStart(2, '0');
            return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
        }

        function formatDuration(ms) {
            const s = Math.floor(ms / 1000);
            const h = Math.floor(s / 3600);
            const m = Math.floor((s % 3600) / 60);
            if (h > 0) return `${h}小时${m.toString().padStart(2,'0')}分`;
            return `${m}分${(s % 60).toString().padStart(2,'0')}秒`;
        }

        function formatDistance(m) {
            if (m >= 1000) return (m / 1000).toFixed(2) + ' km';
            return Math.round(m) + ' m';
        }

        function loadScript(src) {
            return new Promise((resolve, reject) => {
                const s = document.createElement('script');
                s.src = src;
                s.onload = resolve;
                s.onerror = reject;
                document.head.appendChild(s);
            });
        }

        async function initMap() {
            if (!amapKey) {
                throw new Error('AMap key not configured');
            }
            await loadScript(`https://webapi.amap.com/maps?v=1.4.15&key=${amapKey}`);
            map = new AMap.Map('map', {
                zoom: 13,
                center: [116.397428, 39.90923]
            });
            infoWindow = new AMap.InfoWindow({
                offset: new AMap.Pixel(0, -8),
                autoMove: true
            });
        }

        function renderLegend() {
            const el = document.getElementById('legend');
            el.innerHTML = TIME_BUCKETS.map(b => `
                <div class="legend-item">
                    <div class="legend-color" style="background:${b.color}"></div>
                    <span>${b.label}</span>
                </div>
            `).join('');
        }

        function renderCalendar() {
            const el = document.getElementById('calendar');
            const daily = allData.daily || {};

            const months = Object.keys(daily).sort().reverse();
            el.innerHTML = months.map(monthKey => {
                const [year, month] = monthKey.split('-').map(Number);
                const firstDay = new Date(year, month - 1, 1).getDay();
                const daysInMonth = new Date(year, month, 0).getDate();
                const dayCells = [];
                for (let i = 0; i < firstDay; i++) dayCells.push('<div class="day empty"></div>');
                for (let d = 1; d <= daysInMonth; d++) {
                    const info = daily[monthKey][d];
                    let style = 'background:#ebedf0';
                    if (info) {
                        const intensity = Math.min(1, info.duration / (3 * 3600 * 1000));
                        const alpha = 0.2 + intensity * 0.8;
                        style = `background:rgba(33,150,243,${alpha})`;
                    }
                    const dateStr = `${year}-${month.toString().padStart(2,'0')}-${d.toString().padStart(2,'0')}`;
                    dayCells.push(`<div class="day" style="${style}" onclick="selectDay('${dateStr}')">${d}</div>`);
                }
                return `
                    <div class="month">
                        <div class="month-name">${year}年${month}月</div>
                        <div class="weekdays">
                            <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
                        </div>
                        <div class="days">${dayCells.join('')}</div>
                    </div>
                `;
            }).join('');
        }

        function renderDateList(dates) {
            const el = document.getElementById('track-list');
            if (dates.length === 0) {
                el.innerHTML = '<div style="color:#999;text-align:center;margin-top:20px">没有记录</div>';
                return;
            }
            el.innerHTML = dates.map(dateStr => {
                const info = getDayInfo(dateStr);
                const duration = info ? info.duration : 0;
                return `
                    <div class="track-item" onclick="selectDay('${dateStr}')">
                        <div class="track-name">${dateStr}</div>
                        <div class="track-meta">${info ? info.count : 0} 个点 · ${formatDistance(computeTotalDistanceForDate(dateStr))} · ${formatDuration(duration)}</div>
                    </div>
                `;
            }).join('');
        }

        function getDayInfo(dateStr) {
            const d = new Date(dateStr + 'T00:00:00');
            const key = `${d.getFullYear()}-${(d.getMonth()+1).toString().padStart(2,'0')}`;
            const day = d.getDate();
            const month = allData.daily[key];
            return month ? month[day] : null;
        }

        function computeTotalDistanceForDate(dateStr) {
            const startTime = new Date(dateStr + 'T00:00:00').getTime();
            const endTime = new Date(dateStr + 'T23:59:59.999').getTime();
            const dayPoints = currentPoints.filter(p => p.timestamp >= startTime && p.timestamp <= endTime);
            return computeTotalDistance(dayPoints);
        }

        function escapeHtml(s) {
            return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
        }

        function renderMap(points) {
            if (!map) return;
            map.remove(markers);
            markers = [];

            if (points.length === 0) {
                infoWindow && infoWindow.close();
                return;
            }

            // Sample points if too many to keep map responsive
            const MAX_POINTS = 5000;
            let displayPoints = points;
            if (points.length > MAX_POINTS) {
                const step = Math.ceil(points.length / MAX_POINTS);
                displayPoints = [];
                for (let i = 0; i < points.length; i += step) {
                    displayPoints.push(points[i]);
                }
                console.log(`Sampling: ${points.length} -> ${displayPoints.length} points`);
            }

            const bounds = new AMap.Bounds();
            displayPoints.forEach(p => {
                const bucket = getBucket(p.timestamp);
                const isSelected = selectedPoint && selectedPoint.id === p.id;
                const marker = new AMap.CircleMarker({
                    center: [p.longitude, p.latitude],
                    radius: isSelected ? 12 : 7,
                    fillColor: bucket.color,
                    strokeColor: isSelected ? '#000' : bucket.color,
                    fillOpacity: 0.9,
                    strokeOpacity: 1,
                    strokeWeight: isSelected ? 2 : 1,
                    extData: p
                });
                marker.on('click', () => {
                    selectedPoint = p;
                    infoWindow.setContent(`
                        <div class="info-popup">
                            <div class="time">${formatDateTime(p.timestamp)}</div>
                            <div>纬度: ${p.latitude.toFixed(6)}</div>
                            <div>经度: ${p.longitude.toFixed(6)}</div>
                            <div>海拔: ${p.altitude.toFixed(1)} m</div>
                            <div>精度: ${p.accuracy.toFixed(1)} m</div>
                        </div>
                    `);
                    infoWindow.open(map, [p.longitude, p.latitude]);
                    renderMap(points);
                });
                markers.push(marker);
                bounds.extend([p.longitude, p.latitude]);
            });

            map.add(markers);
            if (!selectedPoint) {
                map.setBounds(bounds);
            }
        }

        async function update(startDate, endDate) {
            const startTime = new Date(startDate + 'T00:00:00').getTime();
            const endTime = new Date(endDate + 'T23:59:59.999').getTime();

            document.getElementById('loading').style.display = 'flex';
            document.getElementById('loading').innerHTML = '<div>正在加载轨迹点...</div>';

            try {
                currentPoints = await loadPointsRange(startTime, endTime);
            } catch (e) {
                document.getElementById('loading').innerHTML = `<div>加载失败: ${escapeHtml(e.message)}</div>`;
                return;
            } finally {
                document.getElementById('loading').style.display = 'none';
            }

            const involvedTrackIds = new Set(currentPoints.map(p => p.trackId));
            const filteredTracks = allData.tracks.filter(t => involvedTrackIds.has(t.id));

            document.getElementById('stat-tracks').textContent = filteredTracks.length + ' 条记录段';
            document.getElementById('stat-points').textContent = currentPoints.length + ' 个点';

            const dates = [];
            let current = new Date(startTime);
            while (current.getTime() <= endTime) {
                dates.push(formatDateInput(current));
                current.setDate(current.getDate() + 1);
            }
            renderDateList(dates);
            renderMap(currentPoints);
        }

        async function loadPointsRange(start, end) {
            const res = await fetch(`/api/points.json?start=${start}&end=${end}`);
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const data = await res.json();
            return data.points || [];
        }

        async function loadAllPoints() {
            if (!allData.meta.minTimestamp || !allData.meta.maxTimestamp) return;
            const startInput = document.getElementById('start-date');
            const endInput = document.getElementById('end-date');
            startInput.value = formatDateInput(new Date(allData.meta.minTimestamp));
            endInput.value = formatDateInput(new Date(allData.meta.maxTimestamp));
            await applyRange();
        }

        async function applyRange() {
            await update(document.getElementById('start-date').value, document.getElementById('end-date').value);
        }

        function resetRange() {
            const min = allData.meta.minTimestamp;
            const max = allData.meta.maxTimestamp;
            if (!min || !max) return;

            // Default to last 7 days or all data if less than 7 days
            const maxDate = new Date(max);
            const minDate = new Date(min);
            const sevenDaysAgo = new Date(maxDate.getTime() - 6 * 24 * 60 * 60 * 1000);
            const startDate = sevenDaysAgo < minDate ? minDate : sevenDaysAgo;

            document.getElementById('start-date').value = formatDateInput(startDate);
            document.getElementById('end-date').value = formatDateInput(maxDate);
            selectedPoint = null;
            infoWindow && infoWindow.close();
            applyRange();
        }

        async function selectDay(dateStr) {
            document.getElementById('start-date').value = dateStr;
            document.getElementById('end-date').value = dateStr;
            selectedPoint = null;
            infoWindow && infoWindow.close();
            await applyRange();
        }

        function computeTotalDistance(points) {
            if (points.length < 2) return 0;
            let total = 0;
            const R = 6371000;
            for (let i = 1; i < points.length; i++) {
                const prev = points[i - 1];
                const curr = points[i];
                const dLat = (curr.latitude - prev.latitude) * Math.PI / 180;
                const dLon = (curr.longitude - prev.longitude) * Math.PI / 180;
                const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                          Math.cos(prev.latitude * Math.PI / 180) * Math.cos(curr.latitude * Math.PI / 180) *
                          Math.sin(dLon / 2) * Math.sin(dLon / 2);
                const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
                total += R * c;
            }
            return total;
        }

        function formatDateInput(d) {
            return `${d.getFullYear()}-${(d.getMonth()+1).toString().padStart(2,'0')}-${d.getDate().toString().padStart(2,'0')}`;
        }

        async function loadData() {
            try {
                const [configRes, tracksRes, dailyRes] = await Promise.all([
                    fetch('/api/config.json'),
                    fetch('/api/data.json'),
                    fetch('/api/daily.json')
                ]);
                if (!configRes.ok) throw new Error('HTTP ' + configRes.status);
                if (!tracksRes.ok) throw new Error('HTTP ' + tracksRes.status);
                if (!dailyRes.ok) throw new Error('HTTP ' + dailyRes.status);

                const config = await configRes.json();
                amapKey = config.amapKey || '';
                if (!amapKey) {
                    throw new Error('AMAP_API_KEY 未配置，请在项目 local.properties 中填写后重试。');
                }
                await initMap();

                const tracksData = await tracksRes.json();
                const dailyData = await dailyRes.json();

                let minTimestamp = null;
                let maxTimestamp = null;
                Object.values(dailyData).forEach(month => {
                    Object.values(month).forEach(day => {
                        if (minTimestamp === null || day.first < minTimestamp) minTimestamp = day.first;
                        if (maxTimestamp === null || day.last > maxTimestamp) maxTimestamp = day.last;
                    });
                });

                allData = {
                    tracks: tracksData.tracks || [],
                    daily: dailyData,
                    meta: {
                        trackCount: tracksData.trackCount || 0,
                        pointCount: tracksData.pointCount || 0,
                        minTimestamp: minTimestamp,
                        maxTimestamp: maxTimestamp
                    }
                };

                renderLegend();
                renderCalendar();
                resetRange();
            } catch (e) {
                document.getElementById('loading').innerHTML = `
                    <div>加载失败</div>
                    <div style="font-size:12px;color:#666;margin-top:8px">${escapeHtml(e.message)}</div>
                    <div style="margin-top:12px"><button class="btn" onclick="location.reload()">重试</button></div>
                `;
            }
        }

        loadData();
    </script>
</body>
</html>
